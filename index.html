<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Webpage</title>
    <link rel="stylesheet" href="styles.css">
    <script src="main.js" defer></script>
</head>
<body>
    <div class="swatch">
        <div id="swatch"></div>
    </div>
    
    <form id="hsl_form">
        <div class="form_row">
            <label for="h">What is the hue?</label>
            <input id="h" placeholder="0-360" required></input>
        </div>
        <div class="form_row">
            <label for"s">What is the saturation?</label>
            <input id="s" placeholder="0-100" required></input>
        </div>
        <div class="form_row">
            <label for"l">What is the lightness?</label>
            <input id="l" placeholder="0-100" required></input>
        </div>
        <button id="submit" disabled>Check</button>
    </form>
</body>
</html>
